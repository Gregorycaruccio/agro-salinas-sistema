<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bird-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
    <linearGradient id="bird-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bird-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="bird-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#CA8A04" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 3D Orb Background -->
  <circle cx="60" cy="60" r="50" fill="url(#bird-orb)" filter="url(#bird-shadow)"/>
  
  <!-- Highlight -->
  <ellipse cx="45" cy="32" rx="22" ry="12" fill="#FFFFFF" opacity="0.4" transform="rotate(-15 45 32)"/>

  <!-- Perch Branch -->
  <path d="M22 84 Q60 88 98 84" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
  <path d="M24 83 Q60 87 96 83" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>

  <!-- Bird Tail -->
  <path d="M42 76 L26 98 L36 96 L48 82 Z" fill="#0284C7"/>
  <path d="M44 76 L34 102 L42 98 L50 82 Z" fill="#F43F5E"/>

  <!-- Bird Body -->
  <path d="M42 45 C42 32 54 24 66 24 C78 24 84 32 84 46 C84 64 74 80 58 80 C44 80 42 60 42 45 Z" fill="url(#bird-body)" filter="url(#bird-shadow)"/>

  <!-- Bird Chest Highlight -->
  <path d="M52 46 C52 38 60 32 68 32 C74 32 78 38 78 48 C78 62 70 74 58 74 C54 74 52 62 52 46 Z" fill="#FDE047" opacity="0.9"/>

  <!-- Bird Wing -->
  <path d="M60 44 C66 44 80 52 78 68 C76 78 62 76 56 62 C54 52 56 44 60 44 Z" fill="url(#bird-wing)"/>

  <!-- Bird Eye -->
  <circle cx="50" cy="36" r="5" fill="#FFFFFF"/>
  <circle cx="49" cy="36" r="3.2" fill="#0F172A"/>
  <circle cx="48" cy="35" r="1.2" fill="#FFFFFF"/>

  <!-- Bird Beak -->
  <path d="M44 38 L32 41 L44 46 Z" fill="#F97316"/>

  <!-- Cute Hamster peeking on the right -->
  <g transform="translate(68, 62)">
    <ellipse cx="16" cy="18" rx="14" ry="12" fill="#FDBA74"/>
    <circle cx="7" cy="8" r="4.5" fill="#FDBA74"/>
    <circle cx="7" cy="8" r="2.5" fill="#F472B6"/>
    <circle cx="25" cy="8" r="4.5" fill="#FDBA74"/>
    <circle cx="25" cy="8" r="2.5" fill="#F472B6"/>
    <circle cx="11" cy="16" r="2.2" fill="#1E293B"/>
    <circle cx="21" cy="16" r="2.2" fill="#1E293B"/>
    <polygon points="16,19 14,18 18,18" fill="#F43F5E"/>
    <!-- Seed in hands -->
    <ellipse cx="16" cy="24" rx="3.5" ry="5" fill="#78350F" transform="rotate(15 16 24)"/>
  </g>
</svg>
