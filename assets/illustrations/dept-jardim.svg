<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="plant-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
    <linearGradient id="pot-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <filter id="plant-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#14532D" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 3D Orb Background -->
  <circle cx="60" cy="60" r="50" fill="url(#plant-orb)" filter="url(#plant-shadow)"/>
  
  <!-- Highlight -->
  <ellipse cx="45" cy="32" rx="22" ry="12" fill="#FFFFFF" opacity="0.38" transform="rotate(-15 45 32)"/>

  <!-- Botanical Monstera / Big Garden Leaves -->
  <g filter="url(#plant-shadow)">
    <!-- Back Left Leaf -->
    <path d="M48 55 C35 35 32 20 52 24 C68 28 62 48 48 55 Z" fill="#16A34A"/>
    <!-- Back Right Leaf -->
    <path d="M68 55 C82 32 92 26 78 20 C64 16 58 38 68 55 Z" fill="#15803D"/>
    <!-- Center Main Lush Leaf -->
    <path d="M60 52 C45 28 50 15 62 14 C74 13 80 28 60 52 Z" fill="url(#leaf-grad)"/>
    <!-- Leaf Spine & Cuts -->
    <path d="M61 50 Q63 30 62 16" stroke="#BBF7D0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Plant Stems -->
  <path d="M60 52 L60 68" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 55 Q56 62 60 68" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 55 Q62 62 60 68" stroke="#14532D" stroke-width="3" stroke-linecap="round"/>

  <!-- 3D Terracotta Ceramic Pot -->
  <g filter="url(#plant-shadow)">
    <!-- Soil -->
    <ellipse cx="60" cy="68" rx="24" ry="6" fill="#451A03"/>
    
    <!-- Pot Rim -->
    <rect x="34" y="66" width="52" height="9" rx="4" fill="url(#pot-terracotta)"/>
    <ellipse cx="60" cy="67" rx="26" ry="3.5" fill="#FED7AA" opacity="0.6"/>

    <!-- Pot Body (Tapered) -->
    <path d="M38 74 L44 98 C45 101 48 103 52 103 L68 103 C72 103 75 101 76 98 L82 74 Z" fill="url(#pot-terracotta)"/>
    
    <!-- Pot 3D Specular Highlight -->
    <path d="M43 76 L48 98 C49 99 50 100 52 100 C50 100 48 97 47 95 L43 76 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Small Garden Trowel sticking out on the right -->
  <g transform="translate(76, 70) rotate(25)" filter="url(#plant-shadow)">
    <path d="M6 0 C12 0 14 12 6 18 C-2 12 0 0 6 0 Z" fill="#CBD5E1"/>
    <line x1="6" y1="0" x2="6" y2="18" stroke="#94A3B8" stroke-width="1"/>
    <rect x="4.5" y="18" width="3" height="12" rx="1.5" fill="#92400E"/>
  </g>
</svg>
