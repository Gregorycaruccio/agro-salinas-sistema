<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="granel-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <linearGradient id="metal-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="kibble-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="granel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#047857" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 3D Orb Background -->
  <circle cx="60" cy="60" r="50" fill="url(#granel-orb)" filter="url(#granel-shadow)"/>
  
  <!-- Orb Highlight -->
  <ellipse cx="45" cy="32" rx="22" ry="12" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 45 32)"/>

  <!-- 3D Scale Base -->
  <path d="M35 88 L85 88 L80 98 L40 98 Z" fill="#1E293B"/>
  <ellipse cx="60" cy="88" rx="25" ry="4" fill="#334155"/>
  <rect x="52" y="89" width="16" height="7" rx="2" fill="#10B981"/>
  <!-- Digital weight display readout -->
  <text x="60" y="94.5" font-family="monospace" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">1.00 KG</text>

  <!-- Scale Platter / Stand -->
  <rect x="58" y="72" width="4" height="16" fill="url(#metal-silver)"/>
  <ellipse cx="60" cy="72" rx="28" ry="5" fill="url(#metal-silver)"/>

  <!-- Metal Grain Scoop on Platter -->
  <path d="M42 66 C42 56 60 52 74 54 C78 55 86 64 80 70 C72 75 42 74 42 66 Z" fill="url(#metal-silver)" filter="url(#granel-shadow)"/>
  <path d="M78 57 L92 48" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M90 49 L94 46" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>

  <!-- Kibbles Heap inside Scoop -->
  <ellipse cx="58" cy="62" rx="14" ry="7" fill="url(#kibble-gold)"/>
  <circle cx="52" cy="59" r="3" fill="#B45309"/>
  <circle cx="58" cy="57" r="3.2" fill="#D97706"/>
  <circle cx="65" cy="60" r="3" fill="#B45309"/>
  <circle cx="56" cy="63" r="2.8" fill="#F59E0B"/>
  <circle cx="62" cy="62" r="3.1" fill="#78350F"/>
  <circle cx="50" cy="63" r="2.5" fill="#D97706"/>

  <!-- Crunchy Kibble Pellets Falling in 3D -->
  <g filter="url(#granel-shadow)">
    <circle cx="34" cy="50" r="4.2" fill="url(#kibble-gold)"/>
    <circle cx="33" cy="49" r="1.2" fill="#FEF3C7"/>
    <circle cx="36" cy="62" r="3.5" fill="url(#kibble-gold)"/>
    <circle cx="86" cy="74" r="3.8" fill="url(#kibble-gold)"/>
  </g>

  <!-- Weight Badge (1 KG) -->
  <g transform="translate(74, 28)" filter="url(#granel-shadow)">
    <rect width="28" height="15" rx="7.5" fill="#FFFFFF"/>
    <text x="14" y="10.5" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#047857" text-anchor="middle">/KG</text>
  </g>
</svg>
