<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="fish-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <linearGradient id="fish-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fish-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <filter id="fish-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F766E" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 3D Orb Background -->
  <circle cx="60" cy="60" r="50" fill="url(#fish-orb)" filter="url(#fish-shadow)"/>
  
  <!-- Highlight -->
  <ellipse cx="45" cy="32" rx="22" ry="12" fill="#FFFFFF" opacity="0.38" transform="rotate(-15 45 32)"/>

  <!-- Water Ripples / Splash at Bottom -->
  <ellipse cx="60" cy="94" rx="38" ry="8" fill="#0D9488" opacity="0.4"/>
  <ellipse cx="60" cy="92" rx="28" ry="5.5" fill="#5EEAD4" opacity="0.6"/>
  <ellipse cx="60" cy="90" rx="18" ry="3.5" fill="#CCFBF1"/>

  <!-- Leaping Fish in 3D Arch -->
  <g filter="url(#fish-shadow)">
    <!-- Tail Fin -->
    <path d="M82 78 C96 82 102 96 90 98 C84 92 82 86 80 82 Z" fill="#2563EB"/>
    <path d="M82 78 C96 74 100 60 88 64 C84 70 82 74 80 78 Z" fill="#3B82F6"/>

    <!-- Fish Body (Curved Leaping Pose) -->
    <path d="M30 48 C42 30 70 34 82 78 C68 84 48 78 30 48 Z" fill="url(#fish-body)"/>

    <!-- Fish Belly (Light Shading) -->
    <path d="M30 48 C40 38 62 42 78 80 C68 83 48 77 30 48 Z" fill="url(#fish-belly)" opacity="0.8"/>

    <!-- Dorsal Fin -->
    <path d="M48 34 C56 22 68 24 72 37 C64 34 54 34 48 34 Z" fill="#1D4ED8"/>

    <!-- Fish Eye -->
    <circle cx="38" cy="46" r="3.5" fill="#FFFFFF"/>
    <circle cx="37" cy="46" r="2.2" fill="#0F172A"/>
    <circle cx="36.5" cy="45.5" r="0.8" fill="#FFFFFF"/>

    <!-- Fish Gill -->
    <path d="M45 42 Q48 48 46 54" stroke="#1E40AF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Fishing Bobber (Float: Red & White Ball) -->
  <g transform="translate(24, 70)" filter="url(#fish-shadow)">
    <circle cx="10" cy="10" r="9" fill="#EF4444"/>
    <path d="M1 10 A9 9 0 0 0 19 10 Z" fill="#FFFFFF"/>
    <circle cx="10" cy="10" r="1.5" fill="#1E293B"/>
    <line x1="10" y1="1" x2="10" y2="19" stroke="#1E293B" stroke-width="1.2"/>
    <!-- Line leading up -->
    <path d="M10 1 Q16 -12 28 -28" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2,2" fill="none" opacity="0.8"/>
  </g>
</svg>
