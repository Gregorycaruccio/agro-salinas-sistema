<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="med-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <linearGradient id="cap-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="cap-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="med-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 3D Orb Background -->
  <circle cx="60" cy="60" r="50" fill="url(#med-orb)" filter="url(#med-shadow)"/>
  
  <!-- Highlight -->
  <ellipse cx="45" cy="32" rx="22" ry="12" fill="#FFFFFF" opacity="0.38" transform="rotate(-15 45 32)"/>

  <!-- Protection Shield in Background of Capsule -->
  <g filter="url(#med-shadow)">
    <path d="M60 26 C75 26 84 32 84 46 C84 66 60 82 60 82 C60 82 36 66 36 46 C36 32 45 26 60 26 Z" fill="url(#shield-grad)"/>
    <path d="M60 30 C72 30 79 35 79 47 C79 63 60 76 60 76 C60 76 41 63 41 47 C41 35 48 30 60 30 Z" fill="#10B981" opacity="0.8"/>
    <!-- Medical Cross -->
    <rect x="56" y="40" width="8" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="49" y="47" width="22" height="8" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Large 3D Pill Capsule tilted diagonally in Foreground -->
  <g filter="url(#med-shadow)" transform="translate(60,68) rotate(-35) translate(-36,-16)">
    <!-- Red Half -->
    <path d="M16 8 C16 3.5 20 0 25 0 L36 0 L36 32 L25 32 C20 32 16 28.5 16 24 Z" fill="url(#cap-red)"/>
    <!-- White Half -->
    <path d="M36 0 L47 0 C52 0 56 3.5 56 8 L56 24 C56 28.5 52 32 47 32 L36 32 Z" fill="url(#cap-white)"/>
    <!-- Central Joint Line -->
    <line x1="36" y1="0" x2="36" y2="32" stroke="#64748B" stroke-width="1" opacity="0.4"/>
    <!-- 3D Specular Sheen across capsule -->
    <ellipse cx="36" cy="6" rx="16" ry="3" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <path d="M26 36 Q30 36 30 32 Q30 36 34 36 Q30 36 30 40 Q30 36 26 36 Z" fill="#FEF08A"/>
  <path d="M90 74 Q93 74 93 71 Q93 74 96 74 Q93 74 93 77 Q93 74 90 74 Z" fill="#FEF08A"/>
  <circle cx="28" cy="78" r="2.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
